[package]
name = "diskfree"
version = "0.1.0"
edition = "2024"
description = "Disk usage explorer: an expandable, size-sorted tree for finding what to clean up"
license = "MIT"
repository = "https://github.com/pallewela/diskfree"

[dependencies]
eframe = "0.36.2"
opener = { version = "0.9.0", features = ["reveal"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["disk"] }
trash = "5.2.9"
